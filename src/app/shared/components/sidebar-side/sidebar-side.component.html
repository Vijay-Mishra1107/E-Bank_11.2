<div class="sidebar-panel">
  <div id="scroll-area" [perfectScrollbar] class="navigation-hold" fxLayout="column">
    <div class="sidebar-hold">
      <!-- App Logo -->
      <div class="branding ">
        <img *ngIf="layoutConf.sidebarStyle !== 'compact'" src="../../../../assets/images/E-Bank-new-removebg.png"
          height="80" width="200" alt="" class="app-log me-" />
        <img *ngIf="layoutConf.sidebarStyle === 'compact'" src="../../../../assets/images/E-Bank-new-I-removebg.png"
          height="55" width="55" alt="" class="app-log" style="margin-left: 17px;" />
        <!-- <span class="app-logo-text">E-Bank</span> -->

        <span style="margin: auto" *ngIf="layoutConf.sidebarStyle !== 'compact'"></span>
        <mat-slide-toggle fxHide.lt-md (change)="toggleCollapse()" [checked]="!layoutConf.sidebarCompactToggle"
          *ngIf="layoutConf.sidebarStyle !== 'compact'"></mat-slide-toggle>
      </div>

      <!-- Navigation -->
      <div class="mt-3">
        <app-sidenav [items]="menuItems" [hasIconMenu]="hasIconTypeMenuItem" [iconMenuTitle]="iconTypeMenuTitle">
        </app-sidenav>
      </div>
    </div>
  </div>
</div>
